# =============================================================================
# Formation Ansible 2 jours — Environnement de lab (variante conteneurs)
#
#   docker compose up -d --build
#   docker exec -it controller bash
#
# Équivalent Podman :
#   podman-compose up -d --build
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Nœud de contrôle : on travaille TOUJOURS depuis ici
  # ---------------------------------------------------------------------------
  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    container_name: controller
    hostname: controller
    networks:
      anslab:
        ipv4_address: 172.28.0.20
    volumes:
      # Répertoire de travail partagé : éditez vos YAML depuis votre IDE
      - ../tp:/tp
    extra_hosts:
      - "node1:172.28.0.21"
      - "node2:172.28.0.22"
      - "node3:172.28.0.23"
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # Nœuds cibles : systemd requis pour les modules service/systemd
  # ---------------------------------------------------------------------------
  node1: &node
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: node1
    hostname: node1
    privileged: true            # requis par systemd en conteneur
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      anslab:
        ipv4_address: 172.28.0.21
    extra_hosts:
      - "controller:172.28.0.20"
      - "node1:172.28.0.21"
      - "node2:172.28.0.22"
      - "node3:172.28.0.23"

  node2:
    <<: *node
    container_name: node2
    hostname: node2
    networks:
      anslab:
        ipv4_address: 172.28.0.22

  node3:
    <<: *node
    container_name: node3
    hostname: node3
    networks:
      anslab:
        ipv4_address: 172.28.0.23

networks:
  anslab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
